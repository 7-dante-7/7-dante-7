name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: 7-dante-7
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Calcutta
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_streak: yes
          plugin_streak_mode: daily
          plugin_streak_timezone: Asia/Calcutta
          # Match the "tokyonight" theme vibe roughly with a dark theme or explicit colors if needed
          # Default is usually fine, or use config_display: large
