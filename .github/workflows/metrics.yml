name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 7-dante-7
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Calcutta
          
          # Aesthetics - "Tougher" look
          config_theme: night  # Dark mode
          
          # Plugins
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          
          plugin_repositories: yes
          plugin_repositories_featured: 7-dante-7/Image-based-classification, 7-dante-7/Brain-Tumor-Detection
          plugin_repositories_pinned: 4
          
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

          
          # plugin_streak: yes
          # plugin_streak_mode: weekly
          
          # plugin_achievements: yes
          # plugin_achievements_display: compact
          # plugin_achievements_secrets: yes
          # plugin_achievements_threshold: C
          
          # Habits - Coding hours/days
          # plugin_habits: yes
          # plugin_habits_from: 200
          # plugin_habits_days: 14
          # plugin_habits_facts: yes
          # plugin_habits_charts: yes
          
          plugin_lines: yes
